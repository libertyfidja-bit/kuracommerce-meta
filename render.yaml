services:
  - type: web
    name: kuracommerce-meta
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # One worker: tokens and the SQLite file are shared safely; long timeout: self-hosted models on free GPUs are slow
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 300
    envVars:
      - key: META_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.3
